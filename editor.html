<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editor dei contenuti – Narpo_Juri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@500;700&family=Michroma&display=swap">
<style>
:root{--ink:#24123f;--mu:#5a4b78;--line:#d9c7f5;--vio:#6a2bd9;--mag:#c2187a;--acc:#ff71ce;--soft:#f4ecff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffd9f0,#e6dcff 45%,#cdf3ff);font-family:'Jura',Verdana,sans-serif;font-weight:500;font-size:16px;line-height:1.45;color:var(--ink)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 120px;display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
header{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px}
header h1{font-family:'Michroma',sans-serif;font-weight:400;font-size:20px}
nav{position:sticky;top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:2px}
nav button{text-align:left;border:0;background:none;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;color:var(--vio)}
nav button[aria-current]{background:var(--vio);color:#fff}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card>h2{font-family:'Michroma',sans-serif;font-weight:400;font-size:16px;margin-bottom:4px}
.mu{color:var(--mu)}.sm{font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f.w{grid-column:1/-1}
.f label{font-weight:700;font-size:14px}
.f small{color:var(--mu)}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;min-height:42px;border:1px solid var(--mu);border-radius:10px;background:#fff;padding:8px 12px}
textarea{min-height:92px;resize:vertical;font-family:inherit}
.ck{flex-direction:row;align-items:center;gap:10px}.ck input{width:22px;height:22px}
.item{border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:12px 14px;margin-top:12px;background:#fff}
.item>summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none}
.item>summary::-webkit-details-marker{display:none}
.item>summary::before{content:'▸';color:var(--vio)}.item[open]>summary::before{content:'▾'}
.item>summary span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border:0;border-radius:999px;background:var(--vio);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--mu)}.btn.mag{background:var(--mag)}
.btn.s{min-height:34px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;z-index:5}
.note{background:#fff8d6;border:1px solid #e3cf7a;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
#out{width:100%;min-height:220px;font-family:'Courier New',monospace;font-size:13px;margin-top:10px}
[hidden]{display:none!important}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;flex-direction:row;flex-wrap:wrap}.grid{grid-template-columns:1fr}.bar{padding:8px;gap:6px 8px}.bar .btn{min-height:38px;padding:0 14px;font-size:14px}#dirty{flex:1 1 100%;text-align:center}#dirty:empty{display:none}.item>summary{flex-wrap:wrap}.item>summary span{flex:1 1 100%;white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Editor dei contenuti</h1>
    <p class="mu" style="margin-top:4px">Compila i moduli, scarica il nuovo <b>content.js</b> e caricalo su GitHub al posto di quello vecchio (Add file → Upload files).</p>
    <p class="sm" id="origin" style="margin-top:8px" role="status"></p>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center">
      <label class="btn gh" for="file">Apri un content.js dal PC</label><input id="file" type="file" accept=".js,text/javascript" hidden>
    </div>
  </header>
  <nav id="nav" aria-label="Sezioni"></nav>
  <main id="main"></main>
</div>
<div class="bar">
  <span id="dirty" class="sm mu" role="status"></span>
  <button class="btn mag" id="dl">Scarica content.js</button>
  <button class="btn gh" id="show">Mostra / copia il testo</button>
</div>

<script src="content.js" onerror="window.NJC_MISSING=1"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pad3=n=>String(n).padStart(3,'0');

/* ---- campi: t = testo, u = indirizzo, d = data, n = numero, c = spunta, s = scelta, a = testo lungo,
        L = elenco (una voce per riga), V = elenco separato da virgole, F = foto (percorso | didascalia), M = coppie (chiave = valore) ---- */
const SEZ=[
 {id:'canale',t:'Canale e mascotte',h:'Nome, frase, bio e indirizzi. I social lasciati vuoti non compaiono sul sito.',obj:'canale',f:[
   ['nome','Nome del canale','t'],['annoInizio','Anno di inizio','n'],['motto','Frase sotto il nome','t',1],['bio','Bio','t',1],
   ['mascotte','Immagine della mascotte','t',1,'Percorso del file caricato nel repository, es. img/tamacast.png'],
   ['twitch','Twitch','u'],['youtube','YouTube','u'],['youtubeNome','Nome del canale YouTube','t'],['tiktok','TikTok','u'],['instagram','Instagram','u'],['x','X','u'],['bluesky','Bluesky','u'],
   ['sito','Indirizzo del sito','u',0,'Serve per il banner “Linkami”']]},
 {id:'live',t:'Prossima live e novità',h:'Lo schermo ON AIR e la scritta scorrevole della home.',obj:'',f:[
   ['prossimaLive.quando','Prossima live: giorno e ora','t',0,'Es. giovedì 19 alle 21:30. Vuoto = “calendario in arrivo”'],['prossimaLive.gioco','Prossima live: gioco','t'],
   ['novita','Novità nella scritta scorrevole','L',1,'Una per riga. Si aggiungono a quelle automatiche (ultima live, numeri dell’archivio).']]},
 {id:'link',t:'Link community',h:'I pulsanti grandi della home, nell’ordine in cui sono qui.',list:'link',name:x=>x.titolo,blank:()=>({titolo:'',sotto:'',url:''}),f:[
   ['titolo','Titolo','t'],['sotto','Riga sotto','t'],['url','Indirizzo','u',1]]},
 {id:'weekly',t:'Weekly Narpoplay',h:'Carica il PDF nel repository, nella cartella weekly, con il nome indicato sotto ogni volume. Per la copertina uso il file immagine con lo stesso nome (.png o .jpg), se c’è; altrimenti la prima pagina del PDF.',list:'weekly',top:1,name:x=>'Volume '+x.n+(x.data?' · '+x.data:''),
   blank:L=>({n:L.reduce((m,x)=>Math.max(m,+x.n||0),0)+1,data:today(),sommario:[],pdf:false}),after:x=>`File atteso: <b>weekly/narpoplay-vol-${pad3(x.n)}.pdf</b> · copertina: se carichi anche <b>weekly/narpoplay-vol-${pad3(x.n)}.png</b> (o .jpg) uso quella, altrimenti la prima pagina del PDF`,f:[
   ['n','Numero del volume','n'],['data','Data di uscita','d'],['sommario','Sommario','L',1,'Una voce per riga'],['pdf','Il PDF è stato caricato nel repository','c',1]]},
 {id:'news',t:'News e articoli',h:'Le più recenti in alto: l’ordine sul sito segue la data.',list:'news',top:1,name:x=>(x.tipo==='articolo'?'[articolo] ':'[news] ')+(x.titolo||'(senza titolo)'),
   blank:()=>({id:'',tipo:'news',data:today(),autore:(D.canale&&D.canale.nome)||'',titolo:'',anteprima:'',testo:[],foto:[],argomenti:[]}),f:[
   ['titolo','Titolo','t',1],['tipo','Tipo','s',0,'',['news','articolo']],['data','Data','d'],['autore','Autore','t'],['argomenti','Argomenti','V',0,'Separati da virgola'],
   ['anteprima','Anteprima','a',1,'Due righe che compaiono nell’elenco'],['testo','Testo','L',1,'Un paragrafo per riga'],
   ['foto','Foto','F',1,'Una per riga: percorso | didascalia  (es. img/foto1.jpg | La didascalia). La prima è quella grande, le altre vanno in galleria.']]},
 {id:'amici',t:'Canali amici',h:'Scrivi qui i canali da mostrare, nell’ordine che vuoi. Se l’elenco è vuoto il sito mostra gli ospiti più presenti nello storico.',obj:'',f:[
   ['amiciOspiti','Dopo i miei canali mostra anche gli ospiti più presenti dello storico','c',1]],
   list:'amici',lt:'I miei canali',name:x=>x.nome||'(senza nome)',blank:()=>({nome:'',link:'',piattaforma:'',gioca:'',testo:'',img:''}),lf:[
   ['nome','Nome','t',0,'Se è il nome di un ospite dello storico, avatar, link e presentazione lasciati vuoti si completano da soli'],['piattaforma','Piattaforma','t',0,'Twitch, YouTube… Vuoto = la ricavo dall’indirizzo'],
   ['link','Indirizzo del canale','u',1],['img','Immagine (avatar)','t',1,'Percorso del file caricato nel repository, es. img/amici/nome.png'],['gioca','Cosa gioca','t',1],['testo','Presentazione','a',1]]},
 {id:'video',t:'Video',h:'Il sito legge da solo gli ultimi video e i dati del canale da YouTube. Quello che scrivi qui è la copia di riserva, usata solo se YouTube non risponde.',obj:'video',f:[
   ['iscrittoDal','Iscritto dal','t'],['caricati','Video caricati','t'],['iscritti','Iscritti','t'],['visualizzazioni','Visualizzazioni','t'],['descrizione','Descrizione del canale','a',1],['preferiti','Video preferiti (linguetta Preferiti)','M',1,'Uno per riga: Titolo = https://… Questi li scegli tu: YouTube non li fornisce.']],
   list:'video.lista',lt:'Elenco dei video',name:x=>x.titolo||'(senza titolo)',blank:()=>({titolo:'',durata:'',data:'',viste:'',link:'',descrizione:''}),lf:[
   ['titolo','Titolo','t',1],['link','Indirizzo del video','u',1],['durata','Durata','t',0,'Es. 12:34'],['data','Data','t'],['viste','Visualizzazioni','t'],['descrizione','Descrizione','a',1]]},
 {id:'brani',t:'Musica',h:'I brani del lettore. Carica i file nella cartella musica. Se l’elenco è vuoto suonano i loop di prova.',list:'brani',name:x=>x.titolo||'(senza titolo)',blank:()=>({titolo:'',src:''}),f:[
   ['titolo','Titolo','t'],['src','File','t',0,'Es. musica/brano.mp3']]},
 {id:'giochi',t:'Giochi e repliche',h:'Correzioni a mano sul backlog.',obj:'',f:[
   ['stati','Stato dei giochi (solo per i casi particolari)','M',1,'Di norma lo stato si scrive nella colonna Finito della scheda Giochi del foglio (Sì, No, In corso). Quello che scrivi qui vince anche sul foglio. Uno per riga: Nome del gioco = finito  (oppure: in corso, non finito, abbandonato).'],
   ['repliche','Link alle repliche','M',1,'Uno per riga: 2026-11-09 = https://…']]},
 {id:'carte',t:'Carte e moderazione',h:'Impostazioni che cambiano di rado.',obj:'',f:[
   ['carte.nome','Nome della collezione di carte','t'],['carte.sigla','Sigla','t'],['carte.logo','Logo della collezione','t',1,'Percorso del file, es. img/cdc.png'],
   ['carte.api','Indirizzo dell’app web delle carte','u',1,'Quello che finisce con /exec'],
   ['paroleVietate','Parole bloccate in chat e guestbook','V',1,'Minuscole, separate da virgola']]}
];

let D=null,cur='canale',dirty=false;
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function set(o,p,v){const k=p.split('.'),l=k.pop();const t=k.reduce((a,x)=>(a[x]==null?(a[x]={}):a[x]),o);t[l]=v}
const toText=(ty,v)=>ty==='L'?(v||[]).join('\n'):ty==='V'?(v||[]).join(', '):ty==='F'?(v||[]).map(x=>(x.src||'')+(x.didascalia?' | '+x.didascalia:'')).join('\n'):ty==='M'?Object.keys(v||{}).map(k=>k+' = '+v[k]).join('\n'):v==null?'':String(v);
function fromText(ty,s){
  if(ty==='L')return s.split('\n').map(x=>x.trim()).filter(Boolean);
  if(ty==='V')return s.split(',').map(x=>x.trim()).filter(Boolean);
  if(ty==='F')return s.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('|');return i<0?{src:x,didascalia:''}:{src:x.slice(0,i).trim(),didascalia:x.slice(i+1).trim()}});
  if(ty==='M'){const o={};s.split('\n').forEach(x=>{let i=x.indexOf(' = '),k,v;if(i>=0){k=x.slice(0,i);v=x.slice(i+3)}else{i=x.indexOf('=');if(i<0)return;k=x.slice(0,i);v=x.slice(i+1)}k=k.trim();v=v.trim();if(k&&v)o[k]=v});return o}
  if(ty==='n')return s===''?'':Number(s);
  return s;
}
let uid=0;
function field(base,f){
  const [key,lab,ty,wide,help,opts]=f,path=(base?base+'.':'')+key,v=get(D,path),id='f'+(++uid),at=`id="${id}" data-p="${esc(path)}" data-t="${ty}"`;
  if(ty==='c')return `<div class="f ck${wide?' w':''}"><input type="checkbox" ${at}${v?' checked':''}><label for="${id}">${lab}</label></div>`;
  const inp=ty==='s'?`<select ${at}>${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`
    :'aLFMV'.includes(ty)&&ty!=='V'?`<textarea ${at} rows="${ty==='a'?3:5}">${esc(toText(ty,v))}</textarea>`
    :`<input type="${ty==='d'?'date':ty==='n'?'number':'text'}" ${at} value="${esc(toText(ty,v))}">`;
  return `<div class="f${wide?' w':''}"><label for="${id}">${lab}</label>${inp}${help?`<small>${help}</small>`:''}</div>`;
}
function listHtml(s,path,fields){
  const L=get(D,path)||[];
  return `<div style="margin-top:14px"><button class="btn" data-add="${s.id}">+ Aggiungi${s.top?' in cima':''}</button></div>
   ${L.map((x,i)=>`<details class="item"${S.open===path+'.'+i?' open':''} data-i="${path}.${i}"><summary><span>${esc(s.name(x))}</span>
     <button class="btn gh s" data-mv="${path}.${i}.-1" aria-label="Sposta su"${i?'':' disabled'}>↑</button><button class="btn gh s" data-mv="${path}.${i}.1" aria-label="Sposta giù"${i<L.length-1?'':' disabled'}>↓</button><button class="btn gh s" data-del="${path}.${i}">Elimina</button></summary>
     <div class="grid">${fields.map(f=>field(path+'.'+i,f)).join('')}</div>${s.after?`<p class="note">${s.after(x)}</p>`:''}</details>`).join('')||'<p class="mu" style="margin-top:12px">Elenco vuoto.</p>'}`;
}
const S={open:''};
function render(){
  $('nav').innerHTML=SEZ.map(s=>`<button data-go="${s.id}"${s.id===cur?' aria-current="page"':''}>${s.t}</button>`).join('');
  if(!D){$('main').innerHTML='<section class="card"><h2>Nessun contenuto caricato</h2><p class="mu">Apri questa pagina dal sito (narpojuri.github.io/editor.html) oppure premi “Apri un content.js dal PC”.</p></section>';return}
  const s=SEZ.find(x=>x.id===cur);uid=0;
  let h=`<section class="card"><h2>${s.t}</h2><p class="mu">${s.h}</p>`;
  if(s.obj!=null)h+=`<div class="grid">${s.f.map(f=>field(s.obj,f)).join('')}</div>`;
  if(s.list&&s.obj!=null)h+=`</section><section class="card"><h2>${s.lt}</h2>`+listHtml(s,s.list,s.lf);
  else if(s.list)h+=listHtml(s,s.list,s.f);
  $('main').innerHTML=h+'</section><section class="card" id="outbox" hidden><h2>Testo di content.js</h2><p class="mu">Se lo scaricamento non parte, copia questo testo e incollalo nel file su GitHub (matita → incolla → Commit changes).</p><textarea id="out" readonly></textarea><button class="btn gh" id="copy" style="margin-top:8px">Copia tutto</button> <span id="cpok" class="sm" role="status"></span></section>';
}
function mark(){dirty=true;$('dirty').textContent='Modifiche non ancora scaricate'}

function build(){
  const o=JSON.parse(JSON.stringify(D)),seen={};
  (o.news||[]).forEach(n=>{let id=n.id||slug(n.titolo)||'post';id=slug(id)||'post';let k=id,i=2;while(seen[k])k=id+'-'+(i++);seen[k]=1;n.id=k});
  (o.weekly||[]).forEach(w=>{w.n=+w.n||0;w.pdf=!!w.pdf});
  if(o.canale&&o.canale.annoInizio!=='')o.canale.annoInizio=+o.canale.annoInizio||o.canale.annoInizio;
  const now=new Date().toLocaleString('it-IT');
  return '/* CONTENUTI DEL SITO - generato con editor.html il '+now+'.\n   Si modifica dall\'editor (narpojuri.github.io/editor.html) oppure a mano. */\nwindow.NJC = '+JSON.stringify(o,null,2)+';\n';
}
function check(){
  const w=[];(D.news||[]).forEach((n,i)=>{if(!n.titolo)w.push('News n. '+(i+1)+' senza titolo');if(!/^\d{4}-\d{2}-\d{2}$/.test(n.data||''))w.push('“'+(n.titolo||'news '+(i+1))+'”: manca la data')});
  (D.weekly||[]).forEach(v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v.data||''))w.push('Weekly volume '+v.n+': manca la data')});
  (D.link||[]).forEach(l=>{if(l.titolo&&!/^https?:\/\//.test(l.url||''))w.push('Link “'+l.titolo+'”: l’indirizzo deve iniziare con https://')});
  return w;
}
function load(obj,from){D=obj;['link','weekly','news','amici','brani','novita','paroleVietate'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});['canale','prossimaLive','stati','repliche','video','carte'].forEach(k=>{if(!D[k]||typeof D[k]!=='object')D[k]={}});if(!Array.isArray(D.video.lista))D.video.lista=[];
  $('origin').textContent=from;dirty=false;$('dirty').textContent='';render()}

document.addEventListener('input',e=>{const el=e.target,p=el.dataset&&el.dataset.p;if(!p||!D)return;set(D,p,el.type==='checkbox'?el.checked:fromText(el.dataset.t,el.value));mark();
  const it=el.closest('.item');if(it){const s=SEZ.find(x=>x.id===cur),x=get(D,it.dataset.i);it.querySelector('summary span').textContent=s.name(x);const n=it.querySelector('.note');if(n&&s.after)n.innerHTML=s.after(x)}});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('item')&&e.target.open)S.open=e.target.dataset.i},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go){cur=d.go;S.open='';render();window.scrollTo(0,0);return}
  if(!D)return;
  if(d.add){const s=SEZ.find(x=>x.id===d.add),L=get(D,s.list),x=s.blank(L);if(s.top){L.unshift(x);S.open=s.list+'.0'}else{L.push(x);S.open=s.list+'.'+(L.length-1)}mark();render();const o=document.querySelector('.item[open] input');if(o)o.focus();return}
  if(d.del){e.preventDefault();const k=d.del.split('.'),i=+k.pop(),L=get(D,k.join('.'));if(b.dataset.sure){L.splice(i,1);S.open='';mark();render()}else{b.dataset.sure=1;b.textContent='Sicuro? Premi di nuovo';b.classList.add('mag');b.classList.remove('gh')}return}
  if(d.mv){e.preventDefault();const k=d.mv.split('.'),dir=+k.pop(),i=+k.pop(),p=k.join('.'),L=get(D,p),j=i+dir;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];S.open=p+'.'+j;mark();render();return}
  if(b.id==='dl'||b.id==='show'){
    const w=check(),txt=build();render();const box=$('outbox');box.hidden=false;$('out').value=txt;
    if(w.length)box.insertAdjacentHTML('afterbegin','<p class="note" style="margin:0 0 10px"><b>Da controllare:</b> '+w.map(esc).join(' · ')+'</p>');
    if(b.id==='dl'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));a.download='content.js';document.body.appendChild(a);a.click();a.remove();dirty=false;$('dirty').textContent='Scaricato: ora caricalo su GitHub al posto di quello vecchio.'}catch(err){$('dirty').textContent='Scaricamento non riuscito: copia il testo qui sotto.'}}
    box.scrollIntoView({block:'start'});return}
  if(b.id==='copy'){const t=$('out');const no=()=>{t.select();$('cpok').textContent='Selezionato: premi Ctrl+C.'};try{navigator.clipboard.writeText(t.value).then(()=>$('cpok').textContent='Copiato.',no)}catch(err){no()}}
});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const w={};new Function('window',r.result)(w);if(!w.NJC)throw 0;load(w.NJC,'Aperto dal PC: '+f.name)}catch(err){$('origin').textContent='Non riesco a leggere questo file: deve essere il content.js del sito.'}};r.readAsText(f);e.target.value=''});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(window.NJC)load(window.NJC,'Caricato il content.js che è online adesso.');else{$('origin').textContent='Non ho trovato content.js accanto a questa pagina: aprilo dal PC.';render()}
</script>
</body>
