<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narpo_Juri – il sito del canale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@500;700&family=Michroma&display=swap">
<style>
:root{--ink:#24123f;--mu:#5a4b78;--line:#d9c7f5;--vio:#6a2bd9;--mag:#c2187a;--acc:#ff71ce;--cy:#a9f5ff;--lcd:#b5f5e0;--soft:#f4ecff;--card:#fff;--tit:'Michroma',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffd9f0 0%,#e6dcff 45%,#cdf3ff 100%);font-family:'Jura',Verdana,sans-serif;font-weight:500;font-size:17px;line-height:1.45;color:var(--ink)}
a{color:var(--vio)}a:hover{color:var(--mag)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px;outline:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.h{font-family:var(--tit);font-size:14px;font-weight:400;display:flex;align-items:center;gap:10px;margin:0 0 14px;text-transform:uppercase}
.h i{width:10px;height:10px;background:var(--acc);flex:none}
.pt{font-family:var(--tit);font-size:26px;font-weight:400;line-height:1.25}
.mu{color:var(--mu)}.sm{font-size:14px}.b{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.row>.card{flex:1 1 320px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border:0;border-radius:999px;background:var(--vio);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{color:#ffe1f3}.btn.mag{background:var(--mag);font-family:var(--tit);font-size:12px;font-weight:400}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--mu)}.btn.gh:hover{color:var(--mag)}
.btn[disabled],.btn.off{background:#e6dcf5;color:var(--mu);cursor:default}
.lk{display:inline-block;padding:10px 0;background:none;border:0;color:var(--vio);text-decoration:underline;cursor:pointer}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.st.f{background:var(--vio);color:#fff}.st.c{background:var(--cy)}.st.a{background:#e6dcf5}.st.n{background:none;border:1px dashed var(--mu);color:var(--mu);font-weight:500}
/* menu desktop */
.top{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.top .nm{font-family:var(--tit);font-size:13px;padding:0 14px;color:var(--ink);text-decoration:none}
.top .n{border-radius:999px;padding:11px 16px;text-decoration:none;font-weight:700;background:none;border:0;color:var(--vio);cursor:pointer}
.top .n:hover{color:var(--mag)}
.top .n[aria-current]{background:var(--vio);color:#fff}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hub a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:68px;padding:10px 20px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--acc)}
.hub a:hover{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--vio)}
.hub a span{font-size:14px;color:var(--mu)}
.lv{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:stretch}
.tcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px}
.tc{display:flex;flex-direction:column;gap:4px;position:relative}
.tc .ti{aspect-ratio:5/7;border:5px solid var(--rc,#b9b3c9);border-radius:14px;background:linear-gradient(160deg,#fff,var(--soft) 60%,#cdf3ff);display:flex;align-items:center;justify-content:center;font-family:var(--tit);color:var(--mu);overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.tc .ti img{width:100%;height:100%;object-fit:cover}
.tc.miss .ti{filter:grayscale(1);opacity:.4;box-shadow:none}
button.tc{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tc .ti.art{border:0;background:none;box-shadow:none;aspect-ratio:auto;border-radius:12px;display:block;filter:drop-shadow(0 0 7px var(--rc))}
.tc .ti.art img{height:auto;display:block;border-radius:12px}
.tc.dim{opacity:.28}.tc.sel .ti{outline:4px solid #00a35c;outline-offset:3px}
.tc .sl{position:absolute;top:8px;left:8px;background:#00a35c;color:#fff;border-radius:999px;padding:0 9px;font-weight:700;font-size:14px}
.scx{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.cod{font-family:'Courier New',monospace;font-weight:700;font-size:20px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 12px;user-select:all}
.tc .qt{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;border-radius:999px;padding:0 9px;font-weight:700;font-size:14px}
.rd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rc);margin-right:6px}
.mts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:60px;min-width:0}
.mt:hover{border-color:var(--vio)}.mt .fa{width:44px;height:44px;border-width:2px}
.mt span{display:flex;flex-direction:column;min-width:0}
.lv>div{min-width:0}
.lv iframe{width:100%;border:0;display:block;border-radius:12px;background:#000}
.lv .pl iframe{aspect-ratio:16/9}.lv .ch iframe{height:100%;min-height:480px}
@media (min-width:761px){#more{align-items:center!important;justify-content:center}#more div{max-width:380px;border-radius:22px!important}#more .mo{display:none!important}}
.top .np{margin-left:auto;border:1px solid var(--line);background:var(--soft);border-radius:999px;min-height:36px;padding:0 14px;cursor:pointer;font-size:14px}
.mtop,.tabbar{display:none}
/* hero */
.hero{border-radius:24px;padding:36px 28px;display:flex;flex-wrap:wrap;gap:32px;align-items:center;justify-content:center}
.ring{width:220px;height:220px;border:20px solid var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:14px;color:var(--mu);background:#fff;cursor:pointer;flex:none;overflow:hidden}
.ring img{width:100%;height:100%;object-fit:contain}
.hero .tx{flex:1 1 300px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero h1{font-family:var(--tit);font-size:36px;font-weight:400;line-height:1.25}
.lcd{background:var(--lcd);border:6px solid var(--ink);border-radius:10px;padding:14px;font-family:'Courier New',monospace;font-weight:700;display:flex;flex-direction:column;gap:4px;font-size:14px}
.onair{flex:0 1 250px}.onair b{font-size:20px}
.tick{background:var(--vio);border-radius:999px;overflow:hidden;padding:8px 0;color:#fff;font-weight:700}
.tick span{display:inline-block;white-space:nowrap;padding-left:100%;animation:scorri 40s linear infinite}
@keyframes scorri{to{transform:translateX(-100%)}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:#fff;border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:18px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.tile:hover{border-top-color:var(--vio);color:var(--ink)}
.tile b{font-family:var(--tit);font-size:15px;font-weight:400}
.mc{display:flex;flex-direction:column;gap:8px}
.mc a{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;min-height:44px;background:var(--soft);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink)}
.mc a b{flex:1 1 150px}
/* copertine */
.cv{position:relative;display:flex;aspect-ratio:3/4;width:100%;background:hsl(var(--hu,270) 70% 92%);border:1px solid var(--line);border-left:9px solid var(--ink);border-radius:4px;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mu);overflow:hidden;padding:6px}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 16px}
.g{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-decoration:none;color:var(--ink);min-width:0}
.g b{line-height:1.25}.g:hover b{color:var(--mag)}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.wk{width:120px;aspect-ratio:12/17;flex:none;border-radius:6px;border:1px solid var(--ink);background:linear-gradient(160deg,hsl(var(--hu) 90% 82%),#fff 55%,hsl(calc(var(--hu) + 120) 90% 84%));display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-family:var(--tit);font-size:9px;color:var(--ink);text-decoration:none;overflow:hidden;position:relative}
.wk b{font-size:1.9em;font-weight:400;line-height:1.1}.wk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wk.big{width:min(260px,100%);font-size:16px;padding:16px}
/* lettore */
.disc{width:96px;height:96px;border-radius:50%;border:30px solid var(--ink);outline:4px solid var(--acc);outline-offset:-4px;background:conic-gradient(var(--soft),var(--cy),var(--soft),#ffd9f0,var(--soft));flex:none}
.disc.on{animation:gira 3s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.bar{height:14px;border-radius:999px;background:#e6dcf5;cursor:pointer;border:0;padding:0;width:100%;display:block;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--vio);border-radius:999px}
.pb{width:44px;height:44px;border-radius:50%;border:1px solid var(--mu);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pb:hover{background:var(--soft)}
.tl{margin:14px 0 0;padding:0 0 0 26px}.tl li{padding:2px 0}.tl button{padding:6px 0}
.tl .cur button{font-weight:700;color:var(--ink);text-decoration:none}
/* liste */
.nl a{display:block;padding:10px 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}.nl a:last-child{border:0}
.nl a:hover b{color:var(--mag)}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;background:repeating-linear-gradient(135deg,var(--soft) 0 14px,#fff 14px 28px);border:1px dashed var(--mu);border-radius:8px;color:var(--mu);font-size:14px;padding:8px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vg a{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.msgs{background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:320px;overflow:auto;overflow-wrap:anywhere}
.msgs.tall{max-height:52vh;min-height:200px}
.msgs b{color:var(--vio)}.msgs div:nth-child(even) b{color:var(--mag)}
.bform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fl{display:flex;flex-direction:column;gap:4px;flex:1 1 130px}.fl.w{flex:4 1 220px}
.in{width:100%;min-height:44px;border:1px solid var(--mu);border-radius:999px;background:#fff;padding:6px 16px;font-size:16px}
textarea.in{border-radius:14px;min-height:90px}
.foot{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;align-items:center;color:var(--mu);font-size:15px;padding:0 8px}
.foot nav{display:flex;flex-wrap:wrap;gap:0 20px}
/* backlog */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stats div{background:var(--soft);border-radius:12px;padding:12px 14px}
.stats b{display:block;font-family:var(--tit);font-size:24px;font-weight:400}
.filt summary{cursor:pointer;font-weight:700;padding:10px 0;list-style-position:inside}
.ff{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:10px;align-items:end;margin:6px 0 4px}
.pg{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:20px;flex-wrap:wrap}
.game{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.game .gc{flex:0 0 240px;max-width:100%}.game .gi{flex:1 1 320px;display:flex;flex-direction:column;gap:12px;min-width:0}
dl.sc{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}dl.sc dt{color:var(--mu)}dl.sc dd{margin:0;font-weight:700}
.sess{list-style:none;margin:0;padding:0}
.sess li{display:grid;grid-template-columns:100px 1fr auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sess li:last-child{border:0}
/* weekly */
.edi{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.shelf{display:flex;flex-wrap:wrap;gap:18px;padding:0 4px 14px;border-bottom:10px solid var(--line);border-radius:0 0 6px 6px;margin-bottom:22px}
.shelf>div{display:flex;flex-direction:column;gap:4px;width:120px}
/* news */
.nw{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.nw>div{display:flex;flex-direction:column;gap:16px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border-radius:999px;border:1px solid var(--mu);background:#fff;padding:0 16px;cursor:pointer;font-weight:700}
.chip[aria-pressed=true]{background:var(--vio);border-color:var(--vio);color:#fff}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;background:var(--cy)}.tag.ar{background:var(--acc)}
.feat{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.item{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-of-type{border:0}
.art{max-width:760px;display:flex;flex-direction:column;gap:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
figure{margin:0}figcaption{font-size:14px;color:var(--mu);padding-top:4px}
.side ul{list-style:none;margin:0;padding:0}
/* video, stile 2006 */
.yt{background:#fff;border:1px solid #999;padding:14px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#000;line-height:1.35}
.yt a,.yt .lk{color:#03c}.yt h1{font-size:20px}.yt h3{font-size:13px;background:#e5e5e5;border:1px solid #ccc;border-bottom:0;padding:5px 8px;margin:0}
.yt .bx{border:1px solid #ccc;padding:8px;margin-bottom:12px}
.yt .tabs{display:flex;flex-wrap:wrap;gap:3px;border-bottom:3px solid #c00;margin:10px 0 12px}
.yt .tabs button{border:1px solid #ccc;border-bottom:0;background:#eee;padding:8px 14px;cursor:pointer;font-weight:bold;color:#03c;font-size:13px;border-radius:5px 5px 0 0}
.yt .tabs button[aria-selected=true]{background:#c00;border-color:#c00;color:#fff}
.yt .cols{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
.yt .av{width:88px;height:88px;background:#ddd;border:1px solid #999;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:28px;color:#666}
.yt .sub{background:#fc0;border:1px solid #c90;font-weight:bold;padding:6px 12px;cursor:pointer;color:#000;text-decoration:none;display:inline-block}
.yt .scr{aspect-ratio:4/3;background:#000;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:15px;text-align:center;padding:10px}
.yt .ctl{background:#ddd;border:1px solid #999;display:flex;gap:8px;align-items:center;padding:5px 8px}
.yt .ctl i{flex:1;height:6px;background:#fff;border:1px solid #999}
.yt .stars{color:#c00;font-size:16px;letter-spacing:1px}
.yt .vgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.yt .th{position:relative;aspect-ratio:4/3;background:#ccc;border:1px solid #666;display:flex;align-items:center;justify-content:center;color:#666}
.yt .th span{position:absolute;right:2px;bottom:2px;background:#000;color:#fff;font-size:11px;padding:0 3px}
.yt .msgs{background:#f5f5f5;border-radius:0}.yt .in{border-radius:0;border-color:#999;font-size:13px;min-height:36px}.yt .btn{border-radius:0;background:#ddd;color:#000;border:1px solid #999;min-height:36px}
/* amici */
.fr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.fc{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fa{width:64px;height:64px;border-radius:50%;background:hsl(var(--hu) 70% 85%);border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--tit);overflow:hidden;flex:none}
.fa img{width:100%;height:100%;object-fit:cover}
.live{background:var(--mag);color:#fff}.offl{background:#e6dcf5}
.ban{width:176px;height:62px;border:2px solid var(--ink);background:linear-gradient(90deg,#ffd9f0,#cdf3ff);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--tit);font-size:11px;flex:none}
.ban i{width:26px;height:26px;border-radius:50%;border:6px solid var(--acc)}
.code{width:100%;font-family:'Courier New',monospace;font-size:13px;border:1px solid var(--mu);border-radius:10px;padding:10px;background:var(--soft);min-height:74px;resize:vertical}
/* intro e pannelli */
#intro{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#ffd9f0,#e6dcff 45%,#cdf3ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;text-align:center}
#intro .ring{width:200px;height:200px;animation:pulsa 2.4s ease-in-out infinite;cursor:default}
@keyframes pulsa{50%{box-shadow:0 0 0 18px #ff71ce33}}
#intro h1{font-family:var(--tit);font-weight:400;font-size:clamp(24px,6vw,40px)}
#more{position:fixed;inset:0;z-index:40;background:#24123f66;display:flex;align-items:flex-end}
#more div{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:16px 16px 26px;display:flex;flex-direction:column;gap:6px}
#more a{display:flex;align-items:center;min-height:50px;padding:0 14px;border-radius:12px;background:var(--soft);text-decoration:none;font-weight:700}
[hidden]{display:none!important}
.note{background:#fff8d6;border:1px solid #e3cf7a;border-radius:10px;padding:8px 12px;font-size:14px}

/* ===== IMPOSTAZIONE TELEFONO ===== */
@media (max-width:760px){
body{font-size:16px}
.wrap{padding:0 12px 96px;gap:12px}
#view{gap:12px}
.top{display:none}
.mtop{display:flex;position:sticky;top:0;z-index:20;margin:0 -12px;padding:10px 14px;background:#fffffff2;border-bottom:1px solid var(--line);align-items:center;gap:10px}
.mtop a.nm{font-family:var(--tit);font-size:14px;color:var(--ink);text-decoration:none;flex:1}
.mtop .btn{min-height:38px;padding:0 14px;font-size:10px}
.mtop .np{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--soft)}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px 4px 8px}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;font-size:11px;font-weight:700;text-decoration:none;color:var(--mu);background:none;border:0;border-radius:12px}
.tabbar [aria-current]{color:var(--vio);background:var(--soft)}
.tabbar svg{width:24px;height:24px}
.card{padding:16px;border-radius:16px}
.pt{font-size:20px}
.hero{padding:22px 16px;gap:16px;flex-direction:column;text-align:center}
.hero .tx{align-items:center;gap:10px;flex:none}
.hero h1{font-size:24px}
.ring{width:132px;height:132px;border-width:13px;font-size:12px}
.onair{flex:none;width:100%}
.tiles{grid-template-columns:1fr 1fr;gap:10px}
.hub{grid-template-columns:1fr}.tcg{grid-template-columns:repeat(2,1fr);gap:14px 12px}.lv{grid-template-columns:1fr}.lv .ch iframe{min-height:420px}
.tile{padding:14px;gap:6px;border-radius:14px}.tile svg{width:32px;height:32px}.tile b{font-size:12px}.tile span{font-size:14px}
.five{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px}
.five .g{flex:0 0 38%;scroll-snap-align:start}
.grid{grid-template-columns:repeat(2,1fr);gap:16px 12px}
.stats{grid-template-columns:1fr 1fr}.stats b{font-size:20px}
.ff{grid-template-columns:1fr 1fr}.ff .fl:first-child{grid-column:1/-1}
.game .gc{flex:0 0 150px;margin:0 auto}

<script>
'use strict';
const D=window.NJ,C=window.NJC,CH=C.canale;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n).toLocaleString('it-IT');
const dt=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const dtl=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
const dur=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
const hue=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h};
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
const pad3=n=>String(n).padStart(3,'0');
const mem={};
const LS={get(k,d){if(k in mem)return mem[k];try{const v=localStorage.getItem('nj.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){mem[k]=v;try{localStorage.setItem('nj.'+k,JSON.stringify(v))}catch(e){}}};
const wide=()=>window.matchMedia('(min-width:761px)').matches;

/* ---------- giochi: stesso database dello Storico Live ---------- */
const R=D.R; // [data, minuti, titolo, giochi[], rubriche[], ospiti[]]
const G=[],GI={},SL={};
const FIN=/\bfinal[ei]\b|titoli di coda|\bending\b|\bla fine\b|conclusione|ultima puntata|ultimo episodio|epilogo/i;
for(const r of R)r[3]=r[3].filter(k=>/[\p{L}\p{N}]/u.test(k));
for(const r of R)for(const k of r[3]){let g=GI[k];if(!g){g=GI[k]={k,s:[]};G.push(g)}g.s.push(r)}
const TODAY=R[0][0], RECENT=new Date(new Date(TODAY).getTime()-60*864e5).toISOString().slice(0,10);
for(const g of G){
  let s=slug(g.k);while(SL[s])s+='-2';SL[s]=g;g.slug=s;
  g.n=g.s.length;g.last=g.s[0][0];g.first=g.s[g.n-1][0];g.min=g.s.reduce((a,r)=>a+r[1],0);
  g.m=D.META[g.k]||{};g.c=(D.CONS[g.k]||[]).filter(x=>x!=='Non indicata');
  const rc={};g.s.forEach(r=>r[4].forEach(x=>rc[x]=(rc[x]||0)+1));
  g.rubs=Object.keys(rc).sort((a,b)=>rc[b]-rc[a]);g.rub=g.rubs[0]||'';
  g.st=C.stati[g.k]||(g.s.some(r=>FIN.test(r[2])&&r[3].length<=2)?'finito':(g.n>1&&g.last>=RECENT?'in corso':''));
}
const STL={finito:['f','FINITO'],'in corso':['c','IN CORSO'],abbandonato:['a','ABBANDONATO']};
const stB=g=>g.st&&STL[g.st]?`<span class="st ${STL[g.st][0]}">${STL[g.st][1]}</span>`:'';
const YEARS=new Date(TODAY).getFullYear()-CH.annoInizio;
function cover(g){
  const id=D.COVERS[g.k],b=id&&window.COVERS_B64&&window.COVERS_B64[id];
  return `<span class="cv" style="--hu:${hue(g.k)}"${id&&!b?` data-cv="${esc(id)}"`:''}>${b?`<img src="data:image/jpeg;base64,${b}" alt="">`:esc(g.k)}</span>`;
}
window.NJcovers=()=>document.querySelectorAll('[data-cv]').forEach(el=>{const b=window.COVERS_B64&&window.COVERS_B64[el.dataset.cv];if(b){el.innerHTML=`<img src="data:image/jpeg;base64,${b}" alt="">`;el.removeAttribute('data-cv')}});
const gcard=(g,extra)=>`<a class="g" href="#gioco-${g.slug}">${cover(g)}<b>${esc(g.k)}</b><span class="mu sm">${esc(g.c.slice(0,2).join(', ')||'—')}${extra?' · '+extra+' live':''}</span>${stB(g)}</a>`;
const rndGame=()=>G[Math.floor(Math.random()*G.length)];

const S={q:'',fy:'',fc:'',fr:'',fs:'',sort:'n',page:0,rnd:rndGame(),nf:'',nt:'',nm:'',np:0,vt:'video',vs:0,ring:0,cs:0,cr:'',cn:'',bt:'giochi',bk:'',bl:30,sx:null};
const H=(t)=>`<h2 class="h"><i></i>${t}</h2>`;
const IC={
 backlog:'<svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3"><circle cx="22" cy="22" r="18"/><circle cx="22" cy="22" r="5"/></svg>',
 weekly:'<svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="8" y="5" width="28" height="34" rx="3"/><path d="M15 14h14M15 21h14M15 28h8"/></svg>',
 news:'<svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M6 10h32v20H20l-8 7v-7H6z"/></svg>',
 video:'<svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="5" y="9" width="34" height="26" rx="4"/><path d="M19 16l9 6-9 6z"/></svg>',
 live:'<svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="5" y="10" width="34" height="22" rx="3"/><path d="M15 38h14"/><circle cx="22" cy="21" r="4" fill="currentColor"/></svg>',
 home:'<svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M6 21L22 7l16 14v16H27V27H17v10H6z"/></svg>',
 more:'<svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="currentColor"><circle cx="10" cy="22" r="4"/><circle cx="22" cy="22" r="4"/><circle cx="34" cy="22" r="4"/></svg>'};
const mascot=()=>CH.mascotte?`<img src="${esc(CH.mascotte)}" alt="Tamacast, la mascotte del canale">`:'Tamacast<br>(mascotte)';

/* ---------- chat e guestbook (per ora salvati solo su questo dispositivo) ---------- */
function board(key,o){
  const L=LS.get(key,[]),show=o.max?L.slice(-o.max):L;
  return `<div class="msgs ${o.tall?'tall':''}" aria-live="polite">${show.length?show.map(m=>`<div><b>${esc(m.n)}</b> ${esc(m.t)} <span class="mu sm">· ${esc(m.h)}</span></div>`).join(''):`<p class="mu">${o.empty}</p>`}</div>
  <form class="bform" data-board="${key}"><div class="fl"><label for="${key}n">Nick</label><input class="in" id="${key}n" name="n" maxlength="20" autocomplete="nickname" value="${esc(LS.get('nick',''))}"></div>
  <div class="fl w"><label for="${key}t">${o.label||'Messaggio'}</label><input class="in" id="${key}t" name="t" maxlength="240"></div>
  <button class="btn mag" style="flex:0 1 110px">${o.btn||'Invia'}</button><p class="sm" role="status" style="flex:1 1 100%;color:var(--mag)"></p></form>`;
}
let lastPost=0;
function post(f){
  const n=f.n.value.trim(),t=f.t.value.trim(),out=f.querySelector('[role=status]'),low=(n+' '+t).toLowerCase();
  if(!n||!t){out.textContent='Scrivi sia il nick sia il messaggio.';return}
  if(C.paroleVietate.some(w=>w&&low.includes(w))){out.textContent='Il messaggio contiene parole non ammesse.';return}
  if(Date.now()-lastPost<4000){out.textContent='Un attimo: aspetta qualche secondo tra un messaggio e l’altro.';return}
  lastPost=Date.now();
  const now=new Date(),L=LS.get(f.dataset.board,[]);
  L.push({n,t,h:now.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' '+now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})});
  LS.set(f.dataset.board,L.slice(-200));LS.set('nick',n);render(false);
  document.querySelectorAll('.msgs').forEach(m=>m.scrollTop=m.scrollHeight);
}
const LOCALNOTE='<p class="note">Anteprima: i messaggi restano su questo dispositivo finché non colleghiamo il servizio per la chat condivisa.</p>';

/* ---------- lettore musicale ---------- */
const DEMO=[
 {titolo:'Loop di prova 1 · Menu di sistema',bpm:92,key:0,len:128,mel:[0,null,7,null,12,null,7,4,5,null,9,null,12,null,9,5,7,null,11,null,14,null,11,7,4,null,7,null,12,null,null,null],bass:[-24,-24,-19,-19,-17,-17,-20,-20]},
 {titolo:'Loop di prova 2 · Sala giochi',bpm:128,key:-3,len:192,mel:[12,12,null,15,null,12,17,null,15,null,12,null,10,null,12,null,12,12,null,15,null,19,17,null,15,null,17,null,12,null,null,null],bass:[-24,-12,-24,-12,-21,-9,-19,-7]},
 {titolo:'Loop di prova 3 · Titoli di coda',bpm:76,key:2,len:96,mel:[4,null,null,7,null,null,11,null,12,null,null,11,null,7,null,null,5,null,null,9,null,null,12,null,11,null,7,null,4,null,null,null],bass:[-20,-20,-17,-17,-19,-19,-24,-24]}];
const TR=C.brani.length?C.brani:DEMO;
const P={i:0,on:false,ctx:null,timer:null,step:0,t0:0,audio:null};
const tr=()=>TR[P.i],sd=()=>30/tr().bpm,pDur=()=>tr().src?(P.audio&&P.audio.duration)||0:tr().len*sd();
const pPos=()=>tr().src?(P.audio?P.audio.currentTime:0):(P.ctx&&P.t0?Math.max(0,Math.min(pDur(),P.ctx.currentTime-P.t0)):0);
function beep(t,f,d,type,v){const c=P.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
function sched(){const c=P.ctx,T=tr(),s=sd();while(P.t0+P.step*s<c.currentTime+.3){if(P.step>=T.len){pGo(1);return}const t=Math.max(c.currentTime,P.t0+P.step*s),n=T.mel[P.step%T.mel.length];
  if(n!=null)beep(t,440*2**((n+T.key)/12),s*.9,'square',.04);if(P.step%4===0)beep(t,440*2**((T.bass[(P.step/4|0)%T.bass.length]+T.key)/12),s*3.6,'triangle',.11);P.step++}}
function pStop(){clearInterval(P.timer);P.timer=null;if(P.audio){P.audio.pause()}if(P.ctx&&P.ctx.state==='running')P.ctx.suspend()}
function pStart(from){
  pStop();P.on=true;
  try{
    if(tr().src){if(!P.audio||P.audio.dataset.i!=P.i){P.audio=new Audio(tr().src);P.audio.dataset.i=P.i;P.audio.onended=()=>pGo(1)}if(from!=null)P.audio.currentTime=from;P.audio.play().catch(()=>{P.on=false;pUI()})}
    else{P.ctx=P.ctx||new (window.AudioContext||window.webkitAudioContext)();P.ctx.resume();if(from!=null||!P.t0){const f=from||0;P.step=Math.ceil(f/sd());P.t0=P.ctx.currentTime-f+.06}P.timer=setInterval(sched,80)}
  }catch(e){P.on=false}
  pUI();
}
function pGo(d){P.i=(P.i+d+TR.length)%TR.length;P.t0=0;if(P.audio){P.audio.pause();P.audio=null}if(P.on)pStart(0);else pUI()}
const mmss=s=>{s=Math.floor(s||0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function pUI(){
  const a=$('pl-t');document.querySelectorAll('.np').forEach(b=>{b.hidden=!P.on;b.textContent=wide()?'♪ pausa musica':'♪'});
  if(!a)return;a.textContent='TRACCIA '+String(P.i+1).padStart(2,'0')+' - '+tr().titolo;$('pl-c').textContent=mmss(pPos())+' / '+mmss(pDur());
  $('pl-b').firstElementChild.style.width=(pDur()?pPos()/pDur()*100:0)+'%';$('pl-d').classList.toggle('on',P.on);
  $('pl-p').setAttribute('aria-label',P.on?'Pausa':'Riproduci');$('pl-p').innerHTML=P.on?'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="#24123f"><path d="M4 3h4v12H4zM10 3h4v12h-4z"/></svg>':'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="#24123f"><path d="M5 3l10 6-10 6z"/></svg>';
  document.querySelectorAll('#pl-l li').forEach((li,i)=>li.classList.toggle('cur',i===P.i));
}
setInterval(()=>{if(P.on)pUI()},400);
const player=()=>`<section class="card">${H('Lettore musicale')}<div class="row" style="align-items:center"><div class="disc" id="pl-d" aria-hidden="true"></div>
 <div style="flex:1 1 200px;display:flex;flex-direction:column;gap:8px;min-width:0"><div class="lcd" style="border-width:4px;padding:8px 10px"><span id="pl-t"></span><span id="pl-c"></span></div>
 <button class="bar" id="pl-b" data-a="seek" aria-label="Barra di avanzamento: clicca per spostarti nel brano"><i></i></button>
 <div style="display:flex;gap:8px"><button class="pb" data-a="prev" aria-label="Brano precedente"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="#24123f"><path d="M3 3h2v12H3zM15 3v12L6 9z"/></svg></button>
 <button class="pb" id="pl-p" data-a="play"></button>
 <button class="pb" data-a="next" aria-label="Brano successivo"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="#24123f"><path d="M13 3h2v12h-2zM3 3v12l9-6z"/></svg></button></div></div></div>
 <ol class="tl" id="pl-l">${TR.map((t,i)=>`<li><button class="lk" data-a="track" data-v="${i}">${esc(t.titolo)}</button></li>`).join('')}</ol>
 ${C.brani.length?'':'<p class="mu sm">Brani di prova generati dal sito: i tuoi si aggiungono in content.js.</p>'}</section>`;

/* ---------- weekly ---------- */
const WK=C.weekly.slice().sort((a,b)=>b.n-a.n);
const wkPdf=v=>'weekly/narpoplay-vol-'+pad3(v.n)+'.pdf';
const wkCover=(v,big)=>`<span class="wk ${big?'big':''}" style="--hu:${(v.n*47)%360}"${v.pdf?` data-wk="${+v.n}"`:''}>${v.pdf&&WKC[v.n]?`<img src="${WKC[v.n]}" alt="Copertina del volume ${+v.n}">`:''}<span>WEEKLY<br>NARPOPLAY</span><b>VOL.<br>${pad3(v.n)}</b></span>`;
/* la copertina è la prima pagina del PDF, disegnata nel browser */
const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/',WKC={};let pdfLib=null,wkQ=Promise.resolve();
function wkFromPdf(n){
  if(WKC[n])return Promise.resolve(WKC[n]);
  try{const c=sessionStorage.getItem('nj.wk'+n);if(c)return Promise.resolve(WKC[n]=c)}catch(e){}
  return wkQ=wkQ.then(async()=>{
    if(WKC[n])return WKC[n];
    try{
      pdfLib=pdfLib||(async()=>{const m=await import(PDFJS+'pdf.min.mjs');try{const t=await(await fetch(PDFJS+'pdf.worker.min.mjs')).text();m.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}))}catch(e){}return m})();
      const lib=await pdfLib,task=lib.getDocument({url:wkPdf({n})}),doc=await task.promise,pg=await doc.getPage(1);
      const v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:560/v0.width}),cv=document.createElement('canvas');
      cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp,canvas:cv}).promise;
      const u=cv.toDataURL('image/jpeg',.82);WKC[n]=u;try{task.destroy()}catch(e){}
      try{sessionStorage.setItem('nj.wk'+n,u)}catch(e){}
      return u;
    }catch(e){return null}
  });
}
function wkFill(){document.querySelectorAll('[data-wk]').forEach(el=>{if(el.querySelector('img'))return;const n=el.dataset.wk;wkFromPdf(n).then(u=>{if(u&&el.isConnected&&!el.querySelector('img'))el.insertAdjacentHTML('afterbegin',`<img src="${u}" alt="Copertina del volume ${n}">`)})})}
const wkBtn=v=>v.pdf?`<a class="btn" href="${wkPdf(v)}">Leggi il PDF</a>`:`<span class="btn off">PDF da caricare</span>`;

/* ---------- news ---------- */
const NW=C.news.slice().sort((a,b)=>b.data.localeCompare(a.data));
const mese=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const foto=(f,ratio,txt)=>`<span class="ph" style="aspect-ratio:${ratio}">${f&&f.src?`<img src="${esc(f.src)}" alt="${esc(f.didascalia||'')}">`:(txt||'FOTO')}</span>`;
const ntag=n=>`<span class="tag ${n.tipo==='articolo'?'ar':''}">${n.tipo==='articolo'?'ARTICOLO':'NEWS'}</span>`;

/* ---------- canali amici ---------- */
function amici(){
  const c={};R.forEach(r=>r[5].forEach(x=>c[x]=(c[x]||0)+1));
  const plat=l=>/twitch/i.test(l)?'Twitch':/youtu/i.test(l)?'YouTube':/tiktok/i.test(l)?'TikTok':l?'Web':'';
  const auto=Object.keys(c).filter(k=>D.GUEST[k]&&D.GUEST[k].l).sort((a,b)=>c[b]-c[a]).slice(0,9).map(k=>({nome:k,link:D.GUEST[k].l,piattaforma:plat(D.GUEST[k].l),testo:D.GUEST[k].d||'',av:D.GUEST[k].i,avt:D.GUEST[k].t,n:c[k]}));
  // i canali scritti a mano: se il nome è quello di un ospite dello storico, i campi vuoti si completano da lì
  const man=(C.amici||[]).filter(a=>a&&a.nome).map(a=>{const k=Object.keys(D.GUEST).find(x=>x.toLowerCase()===a.nome.trim().toLowerCase())||Object.keys(c).find(x=>x.toLowerCase()===a.nome.trim().toLowerCase()),g=(k&&D.GUEST[k])||{},link=a.link||g.l||'';
    return{nome:a.nome.trim(),link,piattaforma:a.piattaforma||plat(link),gioca:a.gioca||'',testo:a.testo||g.d||'',img:a.img||'',av:a.img?'':g.i,avt:g.t,n:k?c[k]||0:0,live:a.live}});
  if(!man.length)return auto;
  return C.amiciOspiti?man.concat(auto.filter(x=>!man.some(m=>m.nome.toLowerCase()===x.nome.toLowerCase()))):man;
}
function fillAv(){document.querySelectorAll('[data-av]').forEach(el=>{const b=window.GUEST_B64&&window.GUEST_B64[el.dataset.av];if(b){el.innerHTML=`<img src="data:image/${el.dataset.t||'jpeg'};base64,${b}" alt="">`;el.removeAttribute('data-av')}})}
function needAv(){if(window.GUEST_B64)return fillAv();if(needAv.q)return;needAv.q=1;const s=document.createElement('script');s.src='ospiti.js';s.onload=fillAv;document.body.appendChild(s)}

/* =================== PAGINE =================== */
const PG={};
PG.home=()=>{
  const last=R.slice(0,3),w=WK[0];
  let act=G.filter(g=>g.st==='in corso').sort((a,b)=>b.last.localeCompare(a.last)),actOk=act.length>0;
  if(!actOk){act=[];for(const r of R){for(const k of r[3])if(!act.includes(GI[k]))act.push(GI[k]);if(act.length>=5)break}}
  const now=new Date(),md=String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),yy=String(now.getFullYear());
  const day=R.filter(r=>r[0].slice(5)===md&&r[0].slice(0,4)<yy);
  const pl=C.prossimaLive,vol=w?`online il volume ${w.n} del Weekly Narpoplay`:'';
  const tick=[...C.novita,vol,pl.quando?`prossima live: ${pl.quando}${pl.gioco?' – '+pl.gioco:''}`:'',`ultima live: ${R[0][2]}`,`${nf(R.length)} live e ${nf(G.length)} giochi nell’archivio`].filter(Boolean);
  const soc=[['instagram','Instagram'],['x','X'],['bluesky','Bluesky'],['tiktok','TikTok']].filter(x=>CH[x[0]]);

const mkOf=c=>(MK.find(m=>m[1].includes(c))||MK[MK.length-1])[0],mkOrd=c=>{const m=MK.find(x=>x[1].includes(c));return m?m[1].indexOf(c):99};

   ${ptot?`<section class="card">${H('Probabilità')}<div class="mc">${d.rarita.map((r,i)=>`<div style="display:flex;gap:12px;background:var(--soft);border-radius:10px;padding:8px 12px"><b style="flex:1">${rdot(i)}${esc(r.emoji||'')} ${esc(r.nome)}</b><span class="mu">${(r.peso/ptot*100).toLocaleString('it-IT',{maximumFractionDigits:1})}%</span></div>`).join('')}</div><p class="sm mu" style="margin-top:10px">Alcuni pacchetti possono avere probabilità proprie.</p></section>`:''}
  </div>
  <section class="card">${H('Come funziona')}<ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px"><li>In live riscatti un pacchetto con i punti canale: le carte finiscono nel tuo album.</li><li>Qui scrivi il tuo nome utente e vedi le carte trovate, quelle che mancano e i doppioni.</li><li>Con abbastanza doppioni scegli quali scartare e prepari lo scambio: ricevi un codice.</li><li>Scrivi il codice in chat con <b>${esc(d.cmd||'!scambia')}</b>: serve a confermare che l’account è il tuo. Il pacchetto scambio si apre da solo in diretta.</li><li>Le carte si possono anche regalare a un altro spettatore, dalla chat.</li></ol></section>`;
};
PG.chat=()=>`<section class="card"><h1 class="pt">Chat del sito</h1><div style="margin:12px 0">${LOCALNOTE}</div>${board('chat',{tall:1,empty:'Ancora nessun messaggio: rompi il ghiaccio.'})}</section>
 <section class="card">${H('Guestbook')}<p class="mu" style="margin-bottom:12px">Passi di qui per la prima volta? Lascia una firma.</p>${board('guestbook',{empty:'Nessuna firma, per ora.',label:'Firma',btn:'Firma'})}</section>`;

PG.segreto=()=>{
  const long=R.reduce((a,r)=>r[1]>a[1]?r:a),top=G.slice().sort((a,b)=>b.n-a.n)[0],first=R[R.length-1],gc={};R.forEach(r=>r[5].forEach(x=>gc[x]=(gc[x]||0)+1));
  const tg=Object.keys(gc).sort((a,b)=>gc[b]-gc[a])[0];
  return `<section class="card" style="text-align:center"><h1 class="pt">Area segreta</h1><p class="mu" style="margin:8px 0 16px">L’hai trovata. Qui dentro: i record del canale.</p>
  <div class="stats" style="text-align:left"><div><b>${dur(long[1])}</b>la live più lunga (${dt(long[0])})</div><div><b>${top.n}</b>sessioni per ${esc(top.k)}</div><div><b>${dt(first[0])}</b>la prima live in archivio</div><div><b>${gc[tg]}</b>live con ${esc(tg)}</div></div></section>`;
};

/* =================== NAVIGAZIONE =================== */
const MENU=[['home','Home'],['live','Live'],['backlog','Backlog'],['weekly','Weekly Narpoplay'],['news','News e articoli'],['video','Video']];
function route(){const h=location.hash.slice(1)||'home';
  if(h.startsWith('gioco-')&&SL[h.slice(6)])return{p:'backlog',html:()=>pgGame(SL[h.slice(6)])};
  if(h.startsWith('articolo-')){const n=NW.find(x=>x.id===h.slice(9));if(n)return{p:'news',html:()=>pgArt(n)}}
  return PG[h]?{p:h,html:PG[h]}:{p:'home',html:PG.home}}
let curP='';
function render(scroll){
  const r=route(),cur=p=>r.p===p?' aria-current="page"':'';
  $('top').innerHTML=`<a class="nm" href="#home">${esc(CH.nome)}</a>${MENU.map(m=>`<a class="n" href="#${m[0]}"${cur(m[0])}>${m[1]}</a>`).join('')}<button class="n" data-a="more"${['carte','chat','amici','segreto'].includes(r.p)?' aria-current="page"':''}>Altro</button><button class="np" data-a="play" hidden></button>`;
  $('mtop').innerHTML=`<a class="nm" href="#home">${esc(CH.nome)}</a><button class="np" data-a="play" aria-label="Pausa musica" hidden></button><a class="btn mag" href="#live">LIVE</a>`;
  $('tabbar').innerHTML=[['home','Home'],['live','Live'],['backlog','Backlog'],['weekly','Weekly']].map(m=>`<a href="#${m[0]}"${cur(m[0])}>${IC[m[0]]}${m[1]}</a>`).join('')+`<button data-a="more"${['news','video','carte','chat','amici','segreto'].includes(r.p)?' aria-current="page"':''}>${IC.more}Altro</button>`;
  $('view').innerHTML=r.html();
  $('foot').innerHTML=`<span>${esc(CH.nome)} · in live da ${YEARS} anni</span><span>le tue visite: ${nf(LS.get('visite',1))}</span><nav aria-label="Altri link"><a class="lk" href="#amici">canali amici</a><a class="lk" href="${esc(CH.twitch)}">Twitch</a><a class="lk" href="${esc(CH.youtube)}">YouTube</a>${CH.tiktok?`<a class="lk" href="${esc(CH.tiktok)}">TikTok</a>`:''}<button class="lk" data-a="intro">rivedi l’intro</button></nav>`;
  renderBL();pUI();wkFill();
  if(scroll!==false){window.scrollTo(0,0);if(curP)$('view').focus({preventScroll:true})}
  curP=location.hash;
}
window.addEventListener('hashchange',()=>{$('more').hidden=true;render()});

const ACT={
  enter(){$('intro').hidden=true;LS.set('intro',1)},
  intro(){$('intro').hidden=false},
  more(){$('more').hidden=!$('more').hidden},
  rnd(){location.hash='gioco-'+rndGame().slug},
  again(){S.rnd=rndGame();$('rnd').innerHTML=rndBox()},
  pg(v){S.page+=+v;renderBL();$('blres').scrollIntoView({block:'start'})},
  nf(v){S.nf=v;S.np=0;render(false)},nt(v){S.nt=S.nt===v?'':v;S.nm='';S.np=0;if(route().p!=='news'||location.hash.startsWith('#articolo'))location.hash='news';else render(false)},
  nm(v){S.nm=v;S.nt='';S.np=0;render(false)},nclear(){S.nt=S.nm='';render(false)},npg(v){S.np+=+v;render()},
  bt(v){S.bt=v;S.bk='';render(false)},bk(v){S.bk=v;S.bl=30;render(false);$('bltabs').scrollIntoView({block:'start'})},blmore(){S.bl+=30;render(false)},cr(v){S.cr=v;render(false)},
  sxon(v){S.sx=S.sx&&S.sx.set===v?null:{set:v,sel:{},out:null};render(false)},
  dsel(v,b){if(!S.sx)return;const max=+b.dataset.max;S.sx.sel[v]=((S.sx.sel[v]||0)+1)%(max+1);if(!S.sx.sel[v])delete S.sx.sel[v];S.sx.out=null;render(false)},
  sxgo(){const x=S.sx;if(!x||!CT.api)return;x.out={msg:'Preparo lo scambio…',wait:true};render(false);
    jsonp(CT.api+'?api=scambio&u='+encodeURIComponent(cNick())+'&set='+encodeURIComponent(x.set)+'&scelte='+encodeURIComponent(JSON.stringify(x.sel)),r=>{if(S.sx!==x)return;
      x.out=!r?{msg:'Non riesco a preparare lo scambio in questo momento: riprova.'}:r.ok?{cmd:((CA.d&&CA.d.cmd)||'!scambia')+' '+r.codice,min:r.minuti}:{msg:r.errore||'Scambio non riuscito.'};render(false)})},
  sxcopy(){const t=S.sx&&S.sx.out&&S.sx.out.cmd;if(!t)return;const no=()=>$('sxok').textContent='Selezionalo e copialo a mano.';try{navigator.clipboard.writeText(t).then(()=>$('sxok').textContent='Copiato.',no)}catch(e){no()}},vt(v){S.vt=v;render(false)},vpick(v){S.vs=+v;S.vt='video'},vs(v){S.vs=+v;S.vt='video';render()},
  ring(v){const n=amici().length;S.ring=+v?(S.ring+ +v+n)%n:Math.floor(Math.random()*n);render(false)},
  copy(){const t=$('lcode');const ok=()=>$('cpok').textContent='Copiato.';try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();$('cpok').textContent='Seleziona e copia a mano.'})}catch(e){t.select();$('cpok').textContent='Seleziona e copia a mano.'}},
  play(){if(P.on){P.on=false;pStop();pUI()}else pStart()},
  prev(){pGo(-1)},next(){pGo(1)},
  track(v){P.i=+v;P.t0=0;if(P.audio){P.audio.pause();P.audio=null}pStart(0)},
  seek(v,b,e){const r=b.getBoundingClientRect(),f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));if(pDur())pStart(f*pDur())},
  egg(){ACT.egg.n=(ACT.egg.n||0)+1;if(ACT.egg.n>=7){ACT.egg.n=0;location.hash='segreto'}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v,b,e)});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.board)post(e.target);else if(e.target.dataset.cn!=null){S.cn=e.target.nick.value;S.sx=null;CA.at=0;render(false)}});
const onF=e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){S[f]=e.target.value;S.page=0;renderBL()}};
document.addEventListener('input',onF);document.addEventListener('change',onF);
const KON=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let kp=0;
document.addEventListener('keydown',e=>{kp=e.key===KON[kp]?kp+1:(e.key===KON[0]?1:0);if(kp===KON.length){kp=0;location.hash='segreto'}});
let wasWide=wide();window.addEventListener('resize',()=>{if(wide()!==wasWide){wasWide=wide();render(false)}});

/* avvio */
try{if(!sessionStorage.getItem('nj.v')){sessionStorage.setItem('nj.v','1');LS.set('visite',LS.get('visite',0)+1)}}catch(e){}
$('iring').innerHTML=mascot();$('iname').textContent=CH.nome;$('imotto').textContent=CH.motto;
if(!LS.get('intro',0))$('intro').hidden=false;
render(false);
setTimeout(loadVideo,300);
</script>
